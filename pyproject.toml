[project]
name = "verifier-anchored-rl"
version = "0.1.0"
description = "Research archive of search-assisted policy learning and frozen-LLM orchestration experiments."
readme = "README.md"
authors = [{name = "Alexander Richard Towell", email = "lex@metafunctor.com"}]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]
# LLM-extension dependencies. Only required to run the Phase-3
# LLMContextMDP transition against a real model (Tier 2 smoke test
# and Tier 3 ablation). The classical-MDP scaffold (Phase 1/2) has
# no such requirement.
llm = ["httpx>=0.27", "sympy>=1.12"]
# In-process HuggingFace backend (TransformersLLMClient /
# TransformersEmbeddingClient): direct hidden-state access, seeded
# sampling, countable forwards. Runs on the GPU box, not locally.
# lm-format-enforcer constrains verb generation to the JSON schema so a
# small model cannot emit unparseable output (see constrained_json.py).
hf = ["torch>=2.2", "transformers>=4.45", "lm-format-enforcer>=0.10"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]
