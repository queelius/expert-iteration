name: Archive checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - name: Reconstruct saved outcomes
        run: |
          python analysis/reproduce.py
          git diff --exit-code -- analysis/tables.json analysis/tables.md
      - name: Test archive and classical anchors
        run: |
          python -m pytest -q \
            tests/test_archive_reproduction.py tests/test_archive_tutorial.py \
            tests/test_archive_packet.py tests/test_expert_iteration.py \
            tests/test_mcts.py tests/test_value_iteration.py
